<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self';">
  <title>Capri Overlay</title>
  <link rel="stylesheet" href="styles/capri.css">
</head>
<body>
  <div id="offline-banner" hidden>
    ⚠ CONSTRUCT OFFLINE — BRAIN DISCONNECTED
  </div>

  <div id="ticker" hidden>
    <span class="ticker__verb">READY</span>
    <span class="ticker__target"></span>
  </div>

  <canvas id="fx" class="fx"></canvas>
  <canvas id="chip" class="chip" hidden></canvas>

  <div id="capri">
    <canvas id="sprite"></canvas>
  </div>

  <div id="panel" hidden>
    <div class="panel__header">
      <span class="panel__badge">CAPRI</span>
      <button class="panel__close" id="panel-close" title="Закрыть">✕</button>
    </div>
    <div class="panel__body">
      <div class="panel__face" id="panel-face">
        <img id="face-img" src="" alt="Capri Face">
      </div>
      <div class="panel__content">
        <p class="panel__text" id="panel-text">Капри слушает...</p>
        <div class="panel__wave" id="panel-wave" hidden>
          <div class="panel__wave-bar"></div>
          <div class="panel__wave-bar"></div>
          <div class="panel__wave-bar"></div>
          <div class="panel__wave-bar"></div>
          <div class="panel__wave-bar"></div>
        </div>
        <div class="panel__actions" id="panel-actions" hidden></div>
        <form class="panel__chat-form" id="chat-form">
          <input type="text" class="panel__input" id="chat-input" placeholder="Спроси или скомандуй..." autocomplete="off">
          <button type="button" class="panel__mic" id="btn-ptt" title="Зажать для голосового ввода (PTT)">🎤</button>
          <button type="submit" class="panel__send">▶</button>
        </form>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu" hidden>
    <div class="context-menu__title">CAPRI // SYSTEM</div>
    <button class="context-menu__item" data-action="stow">
      <span class="context-menu__icon">⚡</span> УБРАТЬ <span class="context-menu__key">Ctrl+Alt+C</span>
    </button>
    <button class="context-menu__item" data-action="sleep">
      <span class="context-menu__icon">💤</span> СПАТЬ
    </button>
    <button class="context-menu__item" data-action="dance">
      <span class="context-menu__icon">★</span> ТАНЕЦ
    </button>
    <button class="context-menu__item" data-action="talk">
      <span class="context-menu__icon">💬</span> ПОГОВОРИМ?
    </button>
    <button class="context-menu__item" data-action="settings">
      <span class="context-menu__icon">⚙</span> НАСТРОЙКИ
    </button>
    <div class="context-menu__separator"></div>
    <button class="context-menu__item context-menu__item--danger" data-action="quit">
      <span class="context-menu__icon">⏻</span> ВЫХОД
    </button>
  </div>

  <div id="settings-modal" class="settings-modal" hidden>
    <div class="settings-modal__header">
      <span class="settings-modal__title">⚙ CAPRI // SETTINGS</span>
      <button class="settings-modal__close" id="settings-close">✕</button>
    </div>
    <div class="settings-modal__body">
      <div class="settings-field">
        <label for="setting-model">Модель OpenRouter:</label>
        <select id="setting-model" class="settings-input">
          <option value="anthropic/claude-haiku-5.5">Claude 3.5 Haiku (Быстрая)</option>
          <option value="google/gemini-2.5-flash">Gemini 2.5 Flash (Сбалансированная)</option>
          <option value="deepseek/deepseek-chat">DeepSeek Chat (Экономичная)</option>
        </select>
      </div>

      <div class="settings-field">
        <label for="setting-budget">Дневной лимит бюджета ($):</label>
        <input type="number" id="setting-budget" class="settings-input" step="0.05" min="0.05" max="10.0" value="0.50">
      </div>

      <div class="settings-field">
        <label for="setting-motion">Режим анимации (WCAG 2.3.1):</label>
        <select id="setting-motion" class="settings-input">
          <option value="auto">Авто (настройки Windows)</option>
          <option value="full">Полный (динамичный Trigger-стиль)</option>
          <option value="reduced">Reduce Motion (без резких вспышек и глитчей)</option>
        </select>
      </div>

      <div class="settings-field">
        <label for="setting-scale">Масштаб персонажа:</label>
        <div class="settings-slider-row">
          <input type="range" id="setting-scale" min="0.4" max="1.0" step="0.05" value="0.6">
          <span id="setting-scale-val">0.6x</span>
        </div>
      </div>

      <div class="settings-field">
        <label for="setting-volume">Громкость звука:</label>
        <div class="settings-slider-row">
          <input type="range" id="setting-volume" min="0.0" max="1.0" step="0.05" value="0.7">
          <span id="setting-volume-val">70%</span>
        </div>
      </div>

      <div class="settings-row-check">
        <label><input type="checkbox" id="setting-voice"> Голосовой синтез (TTS)</label>
        <label><input type="checkbox" id="setting-mute"> Без звука (Mute)</label>
      </div>

      <div class="settings-field">
        <label for="setting-key">API-ключ OpenRouter (sk-or-...):</label>
        <input type="password" id="setting-key" class="settings-input" placeholder="Сохранить в Windows Credential Manager">
      </div>
    </div>
    <div class="settings-modal__footer">
      <button class="btn btn-save" id="settings-save">СОХРАНИТЬ</button>
      <button class="btn btn-danger" id="settings-cancel">ОТМЕНА</button>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
